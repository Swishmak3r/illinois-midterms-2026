name: Verify election data and static build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Snapshot comparisons validate identity, geography and source contracts;
      # they do not claim that live external sources have been freshly reviewed.
      - run: npm run verify
      - name: Ensure the published page matches its source
        run: git diff --exit-code -- index.html
